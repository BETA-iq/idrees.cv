let examQuestions=[]
let index=0
let correct=0
let wrong=0
function shuffleArray(array){

for (let i = array.length - 1; i > 0; i--) {

let j = Math.floor(Math.random() * (i + 1))

let temp = array[i]
array[i] = array[j]
array[j] = temp

}

return array

}
function start(){

document.getElementById("startScreen").style.display="none"
document.getElementById("setup").style.display="block"

}
function beginExam(){

let val=document.getElementById("countSelect").value

let shuffled = shuffleArray([...questions])

if(val==="all"){

examQuestions = shuffled

}else{

examQuestions = shuffled.slice(0,Number(val))

}
examQuestions.forEach(q=>{
q.options = shuffleArray([...q.options])
})

index=0
correct=0
wrong=0

document.getElementById("setup").style.display="none"
document.getElementById("exam").style.display="block"

showQuestion()

}


function showQuestion(){

if(index>=examQuestions.length){
finishExam()
return
}

let q=examQuestions[index]

document.getElementById("question").innerText="🦷 "+q.question

let html=""

q.options.forEach((opt,i)=>{

html+=`<button class="option" onclick="answer(${i})">${opt}</button>`

})

document.getElementById("options").innerHTML=html

}


function answer(i){

let selected = examQuestions[index].options[i]

if(selected === examQuestions[index].answer){

correct++

}else{

wrong++

}

index++

updateProgress()

showQuestion()

}


function updateProgress(){

document.getElementById("correct").innerText="الاجابات الصحيحة: "+correct
document.getElementById("wrong").innerText="الاجابات الخطأ: "+wrong

let total = correct + wrong

if(total===0) return

let score = (correct/total)*100

let level=""

if(score<30) level="تعبانه ليششش؟؟؟"
else if(score<50) level="هاي ليش ضعيفه زنوبتناا؟؟"
else if(score<70) level="جيد جدا دكتورتناا"
else if(score<85) level="عفييه زنوبتنا"
else if(score<95) level="والله بطله منتاززز"
else level="مفعله هكرررر"

document.getElementById("level").innerText="مستواج: "+level

}


function finishExam() {
  document.getElementById("exam").innerHTML = `
    <h1>خلص الامتحان دكتورتنااا</h1>
    <p class="result">صح: ${correct}</p>
    <p class="result">غلط: ${wrong}</p>
    <p class="result">مستواج: ${getLevel()}</p>
  `;

  updateProgress();
}

function getLevel() {
  let total = correct + wrong;
  if (total === 0) return "لا يوجد نتائج بعد";

  let score = (correct / total) * 100;
  if (score < 30) return "تعبانه ليششش؟؟؟";
  else if (score < 50) return "ضعيفه شويه دكتورتنااا";
  else if (score < 70) return "جيد جدا دكتورتناا";
  else if (score < 85) return "عفييه زنوبتنا";
  else if (score < 95) return "والله بطله منتاز";
  else return "مفعله هكرررر";
}


function toggleProgress(){

let p=document.getElementById("progressPanel")

if(p.style.display==="none" || p.style.display===""){
p.style.display="block"
}else{
p.style.display="none"
}

}
